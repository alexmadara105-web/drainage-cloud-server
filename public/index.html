<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Drainage Monitoring Dashboard</title>
    <style>
        :root {
            --bg-color: #0b1121;
            --card-bg: #111a31;
            --card-border: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --sensor-gas: #fb923c;   /* MQ Sensor Orange */
            --sensor-level: #a78bfa; /* Ultrasonic Sensor Purple */
            --sensor-flow: #4ade80;  /* Flow Sensor Green */
            --sensor-rain: #2dd4bf;  /* Rain Sensor Cyan */
            --status-normal: #10b981;
            --status-alert: #f59e0b;
            --status-critical: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1300px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
        }

        h1 { margin: 0; font-size: 1.8rem; color: var(--accent-blue); }
        .system-status { font-size: 0.9rem; color: var(--text-muted); }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 1300px;
        }

        @media (max-width: 1100px) { .dashboard-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 700px) { .dashboard-grid { grid-template-columns: repeat(1, 1fr); } }

        .drain-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .drain-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .card-header {
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .drain-id {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.75rem;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .drain-name { font-size: 1.1rem; font-weight: 600; }
        .overall-status { font-size: 0.85rem; color: var(--status-normal); font-weight: 600; margin-top: 2px; }

        .sensor-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
        }

        .sensor-info { display: flex; align-items: center; gap: 8px; }
        .icon { font-size: 1.2rem; width: 24px; text-align: center; }
        .sensor-label { font-size: 0.8rem; color: var(--text-muted); }
        .sensor-value { font-size: 1.1rem; font-weight: bold; }

        .sensor-gas .icon, .sensor-gas .sensor-value     { color: var(--sensor-gas); }
        .sensor-level .icon, .sensor-level .sensor-value { color: var(--sensor-level); }
        .sensor-flow .icon, .sensor-flow .sensor-value   { color: var(--sensor-flow); }
        .sensor-rain .icon, .sensor-rain .sensor-value   { color: var(--sensor-rain); }

        .updated-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<header>
    <h1>Multi-Drain Network Monitor</h1>
    <div class="system-status" id="sysLog">Connecting...</div>
</header>

<div class="dashboard-grid" id="mainGrid">
    <!-- Built dynamically via JavaScript -->
</div>

<script>
    const sensorIcons = {
        gas: "🤢",
        level: "📏",
        flow: "💧",
        rain: "🌧️"
    };

    function updateOverallStatusStyle(element, status) {
        if (status.includes("Alert")) element.style.color = 'var(--status-alert)';
        else if (status.includes("Critical")) element.style.color = 'var(--status-critical)';
        else element.style.color = 'var(--status-normal)';
    }

    async function fetchData() {
        try {
            const sysLog = document.getElementById('sysLog');
            const res = await fetch('/api/live');
            const systemData = await res.json();
            sysLog.innerText = `Network Status: Operational | Last Sync: ${new Date().toLocaleTimeString()}`;

            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '';

            Object.keys(systemData).forEach(id => {
                const data = systemData[id];
                
                const card = `
                <div class="drain-card">
                    <div class="drain-id">${id}</div>
                    <div class="card-header">
                        <div class="drain-name">${data.name}</div>
                        <div class="overall-status" id="status-${id}">${data.status}</div>
                    </div>

                    <div class="sensor-row sensor-gas">
                        <div class="sensor-info">
                            <span class="icon">${sensorIcons.gas}</span>
                            <span class="sensor-label">Gas Level (MQ)</span>
                        </div>
                        <div class="sensor-value">${data.gasPPM} PPM</div>
                    </div>

                    <div class="sensor-row sensor-level">
                        <div class="sensor-info">
                            <span class="icon">${sensorIcons.level}</span>
                            <span class="sensor-label">Drain Depth (Ultrasonic)</span>
                        </div>
                        <div class="sensor-value">${data.waterLevelCM} CM</div>
                    </div>

                    <div class="sensor-row sensor-flow">
                        <div class="sensor-info">
                            <span class="icon">${sensorIcons.flow}</span>
                            <span class="sensor-label">Water Flow</span>
                        </div>
                        <div class="sensor-value">${data.flowRateLPM} L/m</div>
                    </div>

                    <div class="sensor-row sensor-rain">
                        <div class="sensor-info">
                            <span class="icon">${sensorIcons.rain}</span>
                            <span class="sensor-label">Rain Status</span>
                        </div>
                        <div class="sensor-value">${data.isRaining ? 'RAINING' : 'CLEAR'}</div>
                    </div>

                    <div class="updated-time">Sync: ${data.lastUpdated}</div>
                </div>
                `;
                
                grid.innerHTML += card;
                
                setTimeout(() => {
                  updateOverallStatusStyle(document.getElementById(`status-${id}`), data.status);
                }, 50);
            });

        } catch (err) {
            console.error("Dashboard Sync Error:", err);
            document.getElementById('sysLog').innerText = 'Network Error: Cannot reach server.';
        }
    }

    setInterval(fetchData, 2000);
    fetchData();
</script>

</body>
</html>
